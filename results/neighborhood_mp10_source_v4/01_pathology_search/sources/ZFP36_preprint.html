w-xl lg:tw-max-w-none tw-mt-3 tw-mb-0"><div class="tw-px-4"><button type="button" class="tw-min-w-full focus:tw-outline-none tw-group"><div class="tw-flex tw-items-center tw-justify-between"><div class="tw-w-full tw-py-2"><div class="tw-flex tw-items-center"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Status:</h3><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-ml-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-color-gray-800">Posted</p></div></div></div><div class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-my-2 tw-flex tw-items-center tw-duration-300 tw-transform tw-bg-gray-100 group-hover:tw-bg-gray-200"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-800 group-hover:tw-text-gray-900 tw-flex"></p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-text-gray-800 group-hover:tw-text-gray-900 tw-h-6 tw-w-6 tw-flex-shrink-0 tw-rounded-full tw-transform tw-duration-300"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-px-4 tw-border-t-2 tw-border-gray-100"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><div class="tw-py-2"><div class="tw-text-left"><h3 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-base">Version <!-- -->1</h3><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black tw-text-gray-700">posted<!-- --> </p></div></div></div><div class="tw-pt-1"><div class="tw-pb-1"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700 tw-flex tw-justify-center tw-w-full tw-mb-2">You are reading this <!-- -->latest<!-- --> <!-- -->preprint<!-- --> version</span></p></div></div></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Abstract</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Bladder cancer (BC) is a malignancy that originates from the cells lining the bladder and is one of the most common cancers of the urinary system, capable of occurring in any part of the bladder. However, the molecular mechanisms underlying the malignant transformation of BC have not been systematically studied. This study integrated cutting-edge techniques of spatial transcriptomics (ST) and spatial metabolomics (SM) to capture the transcriptomic and metabolomic landscapes of both BC and adjacent normal tissues. ST results revealed a significant upregulation of genes associated with choline metabolism and glucose metabolism, while genes related to sphingolipid metabolism and tryptophan metabolism were significantly downregulated. Additionally, significant metabolic reprogramming was observed in BC tissues, including the upregulation of choline metabolism and glucose metabolism, as well as the downregulation of sphingolipid metabolism and tryptophan metabolism. These alterations may play a crucial role in promoting tumorigenesis and immune evasion of BC. The interpretation of ST and SM data in this study offers new insights into the molecular mechanisms underlying BC progression and provides valuable clues for the prevention and treatment of BC.</p></div></span></div><div class="tw-flex tw-flex-wrap tw-pb-3"><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Bladder cancer</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Spatial transcriptome</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Spatial metabolomics</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Choline metabolism</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">TCA cycle</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Sphingolipid metabolism</span></p></div><div class="tw-my-2 tw-mr-2"><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black"><span class="tw-rounded-xl tw-font-bold tw-px-3 tw-py-1 tw-bg-gray-100 tw-text-gray-700">Tryptophan metabolism</span></p></div></ https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-5894269%2Fv1%2F942eb8874cc884305bbba7b0.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fassets-eu.researchsquare.com%2Ffiles%2Frs-5894269%2Fv1%2F942eb8874cc884305bbba7b0.png%3FmaxDims%3D150x150&amp;w=256&amp;q=75"/><p class="tw-antialiased tw-text-left tw-text-sm tw-text-black group-hover:tw-underline">Figure 6</p></button></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">1. Introduction</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>Bladder cancer (BC) is a type of cancer that originates in the cells lining the bladder, a hollow organ that stores urine[<span citationid="CR1" class="CitationRef">1</span>]. Advanced age, male sex and smoking contribute to the development and progression of BC[<span citationid="CR2" class="CitationRef">2</span>]. BC is typically categorized into two main types based on its behavior: non-muscle invasive bladder cancer (NMIBC) and muscle-invasive bladder cancer (MIBC)[<span citationid="CR3" class="CitationRef">3</span>]. NMIBC is confined to the innermost layer of the bladder lining and does not invade the muscle layer[<span citationid="CR4" class="CitationRef">4</span>]. MIBC invades the bladder wall and may spread to nearby lymph nodes or distant organs[<span citationid="CR5" class="CitationRef">5</span>]. For NMIBC, treatments mainly include transurethral resection of bladder tumors (TURBT) combined with chemotherapy or immunotherapy to reduce the risk of recurrence[<span citationid="CR6" class="CitationRef">6</span>]. For MIBC, a radical cystectomy is performed, often followed by reconstructive surgery to create a new way for the body to store and eliminate urine[<span citationid="CR7" class="CitationRef">7</span>]. Occasionally, radiation therapy or chemotherapy is used as an alternative or adjunct to surgery[<span citationid="CR8" class="CitationRef">8</span>]. Immunotherapies, such as PD-1 inhibitors or checkpoint inhibitors, are also commonly used to treat advanced BC, especially in cases where the cancer has spread to other parts of the body[<span additionalcitationids="CR10" citationid="CR9" class="CitationRef">9</span>&ndash;<span citationid="CR11" class="CitationRef">11</span>]. However, the identification of specific druggable targets for BC remains incomplete, and effective therapies to address resistance to immunotherapy have yet to be developed.</p> <p>Compared to normal cells, cancer cells often exhibit alterations in gene expression and metabolic reprogramming[<span citationid="CR12" class="CitationRef">12</span>]. These changes drive the hallmarks of cancer, including uncontrolled proliferation, evasion of growth suppressors, resistance to cell death, the ability to invade surrounding tissues, and changes in the tumor microenvironment (TME) [<span citationid="CR13" class="CitationRef">13</span>]. By comparing gene expression and metabolic profiles between cancerous tissues and adjacent normal tissues, specific dysregulated genes and pathways in cancer cells can be identified, pinpointing the molecular drivers of cancer[<span citationid="CR14" class="CitationRef">14</span>]. Understanding the differences in gene expression and metabolite profiles between cancerous and adjacent normal tissues is crucial, as it provides insights into the molecular mechanisms of cancer initiation, progression, metastasis, and the TME[<span citationid="CR15" class="CitationRef">15</span>, <span citationid="CR16" class="CitationRef">16</span>]. These differences can help identify potential biomarkers for early diagnosis, reveal therapeutic targets, and enhance our understanding of how tumors interact with their microenvironment[<span citationid="CR17" class="CitationRef">17</span>].</p> <p>Spatial transcriptomics (ST) is an emerging field that combines high-throughput RNA sequencing with tissue samples that retain spatial resolution, enabling the mapping of gene expression distribution within tissues at high resolution[<span citationid="CR18" class="CitationRef">18</span>]. Unlike traditional transcriptomics, which provides global gene expression data, ST preserves the tissue&rsquo;s spatial structure, allowing for the analysis of how gene expression varies across different regions of tissues, organs, or organisms[<span citationid="CR19" class="CitationRef">19</span>, <span citationid="CR20" class="CitationRef">20</span>]. This technology can help elucidate complex tissue heterogeneity, study cell interactions, and offer insights into tissue development, disease mechanisms, and the TME [<span citationid="CR21" class="CitationRef">21</span>]. Several studies have mapped the ST landscape of BC, yet these investigations primarily focus on the integration with single-cell techniques or the identification of specific cancer cell subpopulations[<span citationid="CR22" class="CitationRef">22</span>, <span citationid="CR23" class="CitationRef">23</span>]. However, no research has analyzed the gene expression differences between BC and adjacent normal tissues from a metabolic perspective.</p> <p>Spatial metabolomics (SM) refers to the study of metabolites and their distribution within tissues, organs, or organisms while retaining the spatial context[<span citationid="CR24" class="CitationRef">24</span>]. This technique combines high-resolution mass spectrometry or other analytical tools with imaging technologies to map metabolite levels in biological samples[<span citationid="CR25" class="CitationRef">25</span>]. By providing spatial information on the metabolome, SM enables researchers to understand how metabolic processes are localized, how they interact with tissue structures, and how they contribute to diseases such as cancer, neurodegenerative diseases, and metabolic disorders[<span citationid="CR26" class="CitationRef">26</span>]. The integration of ST and SM provides a powerful approach to studying biological systems comprehensively[<span citationid="CR27" class="CitationRef">27</span>, <span citationid="CR28" class="CitationRef">28</span>]. ST maps gene expression within tissues, while SM captures the distribution of metabolites, the ultimate products of cellular processes[<span citationid="CR29" class="CitationRef">29</span>, <span citationid="CR30" class="CitationRef">30</span>]. By combining these two modalities, researchers can gain a more holistic understanding of the molecular landscape of tissues, revealing how gene expression and metabolism are spatially coordinated within the same tissue environment[<span citationid="CR31" class="CitationRef">31</span>]. However, there has not yet been an analysis of differential genes and metabolites in BC utilizing ST and SM.</p> <p>This study, based on ST and SM, integrates the analysis of upregulated and downregulated pathway-related genes and metabolites in BC tissues, aiming to develop potential diagnostic biomarkers, accurately pinpoint the molecular drivers of BC, and provide a reference for the development of targeted therapies and precision medicine.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">2. Materials and Methods</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div id="Sec3" class="Section2">
    <h2>2.1. Human subjects</h2>
    <div class="BlockQuote">
        <p>BLCA and adjacent tissue samples were collected with the patients&rsquo; written informed consent and approved by the Human Research Ethics Committee of the Huashan Hospital, Fudan University (KY2011-009), and used for ST and SM analysis.</p>
    </div>
</div>
<div id="Sec4" class="Section2">
    <h2>2.2. Spatial transcriptome (ST)</h2>
    <div id="Sec5" class="Section3">
        <h2>2.2.1. Sample preparation</h2>
        <p>Following the embedding of fresh tissue, cryosections were prepared, and ten cryosections were placed into enzyme-free tubes for RNA extraction. The RNA Integrity Number (RIN) was required to exceed 7. As the optimal permeabilization time can vary based on species and tissue type, it is essential to optimize the tissue before performing ST sequencing. The tissue optimization chip eight capture areas. Cryosections were affixed to the designated areas on the chip, followed by hematoxylin-eosin (H&amp;E) staining and imaging. Tissue permeabilization was subsequently conducted, allowing mRNAs released from cells to be captured by probes on the chip, resulting in the formation of cDNA labeled with fluorescent tags. The optimal permeabilization time was determined through the analysis of fluorescence imaging results.</p>
    </div>
    <div id="Sec6" class="Section3">
        <h2>2.2.2. ST Library Construction and Sequencing</h2>
        <p>The spatial gene expression chip required for library construction features either two or four capture areas, each comprising 4,992 spots. Each spot was uniquely identified by a spatial barcode and contains millions of nucleotide primers. After tissue permeabilization, the mRNAs released from cells bound to the barcoded primers, facilitating the synthesis of cDNA and the construction of sequencing libraries. Depending on the tissue type, each barcode might correspond to 1 to 10 cells.</p>
        <p>Upon optimizing the permeabilization conditions, the process of constructing the ST library and sequencing can commence. Frozen tissue sections were mounted onto the capture areas of the gene expression chip, followed by fixation, H&amp;E staining, and imaging. Tissue permeabilization was conducted according to the established conditions. The mRNAs released from cells was captured by the primers on the spots. Reverse transcription reagents (RT Master Mix) were then added to the permeabilized tissue sections, leading to the synthesis of full-length cDNA tagged with spatial barcodes during the incubation period.</p>
        <p>The cDNA served as a template for PCR amplification. Once amplification was completed, the products underwent quality control (QC) to evaluate the size and yield of the amplified fragments. Upon passing QC, the sequencing library was constructed. Initially, the cDNA was fragmented into approximately 200&ndash;300 bp pieces using chemical methods. The fragmented cDNA underwent end repair and A-tailing, followed by selection of cDNA fragments. A P7 adapter was ligated to the cDNA fragments, and dual-end sample indexes were incorporated via PCR amplification. Finally, the desired cDNA fragments were selected to create a sequencing-ready cDNA library.</p>
    </div>
    <div id="Sec7" class="Section3">
        <h2>2.2.3. Data processing</h2>
        <p>1) The raw sequencing data was preserved in GEO repository as GSE285715 and processed using the official 10 x Genomics software, Space Ranger (<span class="ExternalRef"><span class="RefSource">https://support.10xgenomics.com/spatial-gene-expression/software/overview/welcome</span></span>). This included the steps of filtering, alignment, and quantification, which collectively produced a gene expression matrix for the detected spots.</p>
        <p>2) For conducting differential analysis and visualizing data, we utilized Seurat (<span class="ExternalRef"><span class="RefSource">https://satijalab.org/seurat/</span></span>), allowing us to examine and visualize the dataset&apos;s heterogeneity by identifying clusters of cells or spots based on their gene expression patterns. To maintain data quality and align sequences to the reference genome, we performed quality control on the raw sequencing data using Space Ranger. This software employs the STAR algorithm for aligning Reads2 to the reference genome, prioritizing uniquely mapped sequences for further analysis. Additionally, Space Ranger employs a GFP annotation file to classify reads as exonic, intronic, or intergenic. Specifically, reads aligning to an exon for at least 50% of their bases are categorized as exonic, while those aligning to a gene but not to an exon were labeled as intronic; remaining reads were classified as intergenic.</p>
        <p>3) Space Ranger facilitates single-sample clustering and visualization to investigated sample heterogeneity through gene expression levels across spots. This clustering process involved UMI normalization, PCA for dimensionality reduction, and clustering using Graph-based and k-means (k&thinsp;=&thinsp;2&hellip;10) methods. The results of PCA were then visualized with t-SNE and UMAP to gain deeper insights into the data structure.</p>
        <p>4) The integration of multiple samples was conducted using the &ldquo;aggr&rdquo; function provided by Space Ranger, which consolidates gene expression data from various samples to enable thorough multi-sample analysis across the spots.</p>
    </div>
</div>
<div id="Sec8" class="Section2">
    <h2>2.3. Spatial metabolomics (SM)</h2>
    <p>The fundamental principle of Matrix-Assisted Laser Desorption/Ionization (MALDI) mass spectrometry imaging is based on the co-crystallization of matrix molecules with the analytes of interest. These matrix molecules are capable of absorbing UV laser radiation at wavelengths of 337 nm or 355 nm, thereby facilitating the ionization of the analytes. During the process, each sample point was irradiated by the laser beam, which leads to the ionization of the target compounds. The sample was subsequently moved across the XY plane using a two-dimensional stage, enabling the separation and detection of ions from the tissue sample by the mass spectrometer. This process generated a mass spectrum that is correlated with the spatial distribution of the sample. Specialized software (SCiLS Lab) was then employed to analyze the mass spectrometric data, ultimately producing spatial distribution maps of metabolites within the range of 50-1300 Da present in the tissue sample.</p>
    <div id="Sec9" class="Section3">
        <h2>2.3.1. Sample preparation</h2>
        <p>The tissue was sectioned into 10 &micro;m slices utilizing a Leica CM1950 cryostat. Initially, the tissue sample, which had been stored in a -80&deg;C freezer, was equilibrated at -20&deg;C within the cryostat chamber for one hour. The sample was then mounted onto the specimen holder, with careful adjustments made to its angle and position. The specimen holder was subsequently secured onto the orientation head of the cryostat. Following the operational manual of the cryostat, tissue sectioning was carried out. The freshly cut sections were transferred to pre-chilled ITO slides using a cooled brush. The back of the slide was gently pressed against the hand to allow body heat to melt the tissue section until it became transparent. Once transparency was achieved, the back of the slide was rubbed with a finger to evaporate moisture from the tissue surface, resulting in the section transitioning from transparent to white. After sectioning, the ITO slides containing the tissue sections were dried in a vacuum desiccator for 30 minutes. A 15 mg/mL solution of 2,5-dihydroxybenzoic acid (DHB) was prepared using a solvent mixture of 90% acetonitrile and 10% water. This DHB matrix solution was uniformly applied to the tissue sections mounted on the ITO slides using a TM-Sprayer matrix sprayer. The instrument parameters were set as follows: temperature at 60&deg;C, flow rate at 0.12 mL/min, pressure at 6 psi, and a total of 30 spray cycles, with a drying time of 5 seconds allowed between each cycle.</p>
    </div>
    <div id="Sec10" class="Section3">
        <h2>2.3.2. Mass Spectrometry Imaging Detection</h2>
        <p>The ITO slide, pre-coated with matrix, was positioned on the mass spectrometry target plate. Utilizing the DataImaging software (Bruker), the tissue region of interest was selected, and the imaging resolution was configured to 50 &micro;m, indicating that the smallest unit in the two-dimensional grid measured 50 &micro;m &times; 50 &micro;m. The imaging area was then divided into a two-dimensional array of points according to its dimensions, with the imaging range set from 50 to 1300 Da. The tissue samples were analyzed under constant laser energy, where a laser beam, directed through a grating, irradiated the designated tissue region on the target plate. The interaction between the tissue samples and the matrix, induced by laser excitation, resulted in ionization and desorption of the molecules. These ions were subsequently identified by the mass spectrometer, yielding data on the mass-to-charge ratio (m/z) and peak intensity for each pixel.</p>
        <p>The raw data were imported into SCiLS Lab software for processing, which included smoothing and Root Mean Square (RMS) normalization. This analysis provided relative intensity information for various m/z values at each spatial point, which was then transformed into a pixelated heat map for imaging analysis.</p>
    </div>
    <div id="Sec11" class="Section3">
        <h2>2.3.3. Substance Identification</h2>
        <p>Using the primary mass spectral (MS Class Ⅰ) peaks identified through marker peaks, we selected high-intensity target peaks to conduct in situ tandem mass spectrometry (MS/MS) fragmentation on the tissue samples. This approach facilitated the collection of secondary fragment ion spectra (MS/MS fragmentation data) from the tissue. The acquired MS/MS spectra were subsequently compared against our in-house database, augmented with public databases, to identify the substances present in the tissue samples.</p>
        <p>For target peaks exhibiting lower intensities, where secondary spectra could not be obtained, identification was performed based on the MS1 information. By searching both the in-house and public databases for compounds with molecular weights that matched the MS1 data within a 10 ppm error range, we identified substances with molecular weights closest to those detected by the instrument.</p>
    </div>
    <div id="Sec12" class="Section3">
        <h2>2.3.4. Data processing</h2>
    </div>
</div>
<h3>1) Spatial Segmentation Analysis</h3>
<p>Spatial segmentation analysis provides a comprehensive overview of mass spectrometry imaging datasets, facilitating the rapid detection of significant features. This method employs statistical approaches to assess the similarity of mass spectra within a designated region, effectively grouping pixels that exhibit similar spectral data. Each group of pixels is then assigned a specific color to visually represent the segmentation.</p>
<h3>2) Spatially-Aware Nearest Shrunken Centroids Clustering</h3>
<p>To obtain partitioning information, spatially-aware nearest shrunken centroids clustering was applied to the intensity data of all metabolites identified in the sample. Pixels within the same region typically displayed a consistent metabolic profile, and this analysis aided in the selection of regions of interest (ROIs) for further investigation.</p>
<p>Parameter settings: Neighborhood smoothing radius (r&thinsp;=&thinsp;2), Shrinkage parameter (s&thinsp;=&thinsp;0), Maximum number of partitionable regions (k&thinsp;=&thinsp;10).</p>
<h3>3) Metabolite Co-localization Analysis</h3>
<p>Metabolite co-localization analysis was employed to identify metabolites that exhibit similar spatial distribution patterns relative to a target metabolite. This analysis could reveal potential interactions between molecules. Co-localization was typically quantified using Pearson&rsquo;s Correlation Coefficient and Manders&rsquo; Colocalization Coefficient.</p>
<h3>4) Relative Quantification of Metabolites</h3>
<p>The relative abundance of different substances across various regions of the tissues was represented by the intensity of the target peak, which was normalized using the Root Mean Square (RMS) method. A higher intensity value indicated a greater abundance of the target metabolite in that specific region.</p>
<div id="Sec17" class="Section2">
    <h2>2.4. Kaplan-Meier plotter database analysis</h2>
    <div class="BlockQuote">
        <p>We assessed the survival data and gene expression levels in BC patients through Kaplan-Meier plotter database (<span class="ExternalRef"><span class="RefSource">http://kmplot.com</span></span>). Our search for BC cohorts (n&thinsp;=&thinsp;405) was conducted through the NCBI Gene Expression Omnibus (GEO; <span class="ExternalRef"><span class="RefSource">https://www.ncbi.nlm.nih.gov/geo/</span></span>) and the Genomic Data Commons Data Portal (<span class="ExternalRef"><span class="RefSource">https://portal.gdc.cancer.gov/</span></span>)[<span class="CitationRef">32</span>]. Due to the limited transcriptomic data available for BC, we used 10 unpaired normal tissue samples and 144 BC tissue samples for a comparative analysis of gene expression.</p>
    </div>
</div>
<div id="Sec18" class="Section2">
    <h2>2.5. Hallmarks of Cancer analysis</h2>
    <p>CancerHallmarks online platform (<span class="ExternalRef"><span class="RefSource">www.cancerhallmarks.com</span></span>) was used to analyze the correlation between genes and their association with any identified cancer hallmarks. This database established a consensus list of cancer hallmark genes by merging 6,763 genes from available mapping resources[<span class="CitationRef">33</span>].</p>
</div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">3. Results</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><div id="Sec20" class="Section2">
    <h2>3.1. ST and Metabolomics Reveal Spatial Heterogeneity in BC and Adjacent Tissues</h2>
    <p>To explore the spatial landscape of BC, we collected cancerous tissues (T418, T419, T421) and adjacent normal tissues (N423, N424, N455) from post-surgery BC patients. ST sequencing was performed based on the 10 &times; Genomics platform. The schematic workflow of sample collection and spatial multi-omics detection was shown in Fig. <span class="InternalRef">1</span>A. Uniform Manifold Approximation and Projection (UMAP) and t-distributed Stochastic Neighbor Embedding (t-SNE) were applied to each sample for dimensionality reduction (Figs. <span class="InternalRef">1</span>B <strong>&ndash; C</strong>). The resulting clusters were spatially visualized (Fig. <span class="InternalRef">1</span>D), and cell-type annotation was performed based on the spatial clustering results (Fig. <span class="InternalRef">1</span>E). Integration of the ST data from the six samples using t-SNE (Fig. <span class="InternalRef">1</span>F) and UMAP (Fig. <span class="InternalRef">1</span>G) multi-sample analyses demonstrated significant gene expression differences between cancer and adjacent tissues, as visualized through violin plots (Fig. <span class="InternalRef">1</span>H). The samples were further divided into 20 subsets (Figs. <span class="InternalRef">1</span>I <strong>&ndash; J, Supplementary Fig. <span class="InternalRef">S1</span>&ndash; 6</strong>, and a heatmap displaying the top 10 differentially expressed genes in each subgroup was generated (Fig. <span class="InternalRef">1</span>K). These results demonstrated that the regional complexity of the BC tissues greatly exceeded that of the adjacent tissues, indicating that BC tissues displayed significantly greater heterogeneity than adjacent tissues.</p>
</div>
<div id="Sec21" class="Section2">
    <h2>3.2. SM Reveals Spatial Heterogeneity in BC and Adjacent Tissues</h2>
    <p>Subsequently, the KEGG enrichment analysis based on differential genes was conducted on three groups of cancer tissues and their corresponding adjacent tissues (T418-N424, T419-N455, T421-N423) (Figs. <span class="InternalRef">2</span>A <strong>&ndash; B</strong>). The results revealed that genes related to choline metabolism and carbon metabolism, especially the tricarboxylic acid (TCA) cycle, were significantly upregulated in cancer tissues; while genes associated with tryptophan metabolism, steroid biosynthesis, and AMPK signaling pathways were significantly downregulated. Orthogonal partial least squares discriminant analysis (OPLS-DA) was then used to further analyze the gene distribution differences between cancerous and adjacent tissues (Figs. <span class="InternalRef">2</span>C <strong>&ndash; D</strong>), again revealing marked gene expression differences. Since traditional metabolic studies could not revealed spatial distribution and heterogeneity, we further performed SM analysis (Fig. <span class="InternalRef">2</span>E), identifying a total of 1362 metabolites, of which 507 were secondarily identified (Figs. <span class="InternalRef">2</span>F <strong>&ndash; G, Supplementary Table. S1</strong>). Spatially-aware nearest shrunken centroids clustering was used on the intensity data of all identified metabolites to obtain partition information. The overall metabolic trend within the same regions was consistent. These results promoted us to combine the KEGG results of differentially expressed genes to further analyze the expression of key genes and their corresponding metabolites in the choline metabolism, TCA cycle, tryptophan metabolism, and steroid biosynthesis pathways in BC tissues and adjacent tissues.</p>
</div>
<div id="Sec22" class="Section2">
    <h2>3.3. Upregulation of Choline Metabolism in BC Tissues</h2>
    <p>Aberrant choline metabolism is a recognized metabolic hallmark associated with tumorigenesis and progression[<span class="CitationRef">34</span>&ndash;<span class="CitationRef">36</span>]. Dysregulation of enzymes controlling both anabolic and catabolic pathways leads to elevated levels of choline-containing precursors and phospholipid breakdown products[<span class="CitationRef">37</span>]. In cancer cells, the increased levels of phosphocholine (PCho) are not only linked to cellular proliferation, but are also closely associated with the TME, particularly the hypoxia TME (Fig. <span class="InternalRef">3</span>A) [<span class="CitationRef">38</span>]. Studies have demonstrated that hypoxia enhances both PCho and total choline levels in xenograft models of human prostate cancer[<span class="CitationRef">39</span>&ndash;<span class="CitationRef">41</span>].</p>
    <p>In our investigation, we analyzed the expression levels of genes related to choline kinase &alpha; (CHK&alpha;) and CTP: phosphocholine cytidylyltransferase (CCT). Compared to normal tissues, the expression of CHK&alpha;, CCT2, CCT3, CCT6A, and CCT8 genes showed a general trend of upregulation in cancer tissues (Figs. <span class="InternalRef">3</span>B <strong>&ndash; G</strong>). Notably, the expression of these genes, except for CHK&alpha;, was negatively correlated with the overall survival (OS) of BC patients, and the expression of these genes was upregulated in BC tissues compared with normal tissues (<strong>Supplementary Fig. S7</strong>). Additionally, we examined the spatial expression levels of capryloylcholine, PCho, and CDP-Cho, intermediates of the choline metabolic pathway, and found them to be consistently elevated (Figs. <span class="InternalRef">3</span>H <strong>&ndash; J</strong>). Furthermore, in the hypoxic core regions of the tumors, both choline metabolism-related genes and intermediate products exhibited higher expression levels compared to peripheral regions (Figs. <span class="InternalRef">3</span>B <strong>&ndash; F</strong>, Figs. <span class="InternalRef">3</span>H <strong>&ndash; J</strong>). We also found the downregulation of the AMPK signaling in cancer tissues (Fig. <span class="InternalRef">2</span>B). Since AMPK signaling pathway can inhibit energy consumption processes such as fatty acid synthesis, cholesterol synthesis, and protein synthesis[<span class="CitationRef">42</span>&ndash;<span class="CitationRef">44</span>], we also investigated the expression levels of AMPK signaling-related genes, and found that they were all downregulated (<strong>Supplementary Fig. S8</strong>). These findings suggest that monitoring choline levels could potentially provide a non-invasive means to assess tumor therapeutic response. Targeting inhibitors of CHK and CCT could represent a promising therapeutic strategy for the treatment of BC.</p>
</div>
<div id="Sec23" class="Section2">
    <h2>3.4. Upregulation of Carbon Metabolism, Particularly the TCA Cycle Pathway, in BC Tissues.</h2>
    <p>The TCA cycle is a fundamental metabolic pathway consisting of eight enzymatic reactions that provide reducing agents to drive ATP production in mitochondria[<span class="CitationRef">45</span>]. Intermediates from the TCA cycle also facilitate anabolic pathways for the synthesis of lipids, nucleic acids, and proteins (Fig. <span class="InternalRef">4</span>A). Cancer cells can disrupt the integrity of the TCA cycle, primarily evidenced by dysregulation in the expression levels of isocitrate dehydrogenase (IDH), succinate dehydrogenase (SDH), and fumarate hydratase (FH) [<span class="CitationRef">46</span>]. The altered expression of these enzymes can further impact the levels of TCA cycle metabolites, consequently promoting cancer progression[<span class="CitationRef">47</span>].</p>
    <p>We observed an increase in the expression levels of the genes IDH1, IDH2, SDHA, SDHB, FH, and malate dehydrogenase 2 (MDH2) in cancerous tissues (Figs. <span class="InternalRef">4</span>B <strong>&ndash; G</strong>, Fig. <span class="InternalRef">4</span>I). Conversely, the expression of the aconitase (ACO) gene, ACO1, was found to be reduced (Fig. <span class="InternalRef">4</span>H). ACO functions not only as an enzyme in the TCA cycle but also plays a critical role in cellular iron homeostasis, thus being referred to as iron regulatory protein-1 (IRP1). Therefore, further studies are warranted to determine whether the dysregulation of aconitase 1 (ACO1) and TCA cycle metabolites in tumors reflects a cross-talk in ACO/IRP1 activity. Notably, the expression of ACO1, IDH1, IDH2, SDHA, FH, and MDH2 was negatively correlated with the OS of BC patients too, and the expression of these genes, except for ACO1, SDHA, MDH2, was upregulated in BC tissues compared with normal tissues. (<strong>Supplementary Fig. S9</strong>).</p>
    <p>In cancerous tissues, we observed an elevation in succinate expression, particularly in the intermediate hypoxic regions of tumors, compared to the surrounding areas (Fig. <span class="InternalRef">4</span>J). Furthermore, we also noted an increase in the levels of phosphoenolpyruvate in cancer tissues (Fig. <span class="InternalRef">4</span>K). Cancer cells secrete succinate, which promotes tumorigenesis through both autocrine and paracrine mechanisms[<span class="CitationRef">48</span>]. Succinate binds to the succinate receptor 1 (SUCNR1) on cancer cells, facilitating tumor metastasis via the AKT/mTOR/HIF-1&alpha; signaling axis[<span class="CitationRef">49</span>]. Under hypoxic conditions, succinate accumulates within tumors, inhibiting prolyl hydroxylases (PHDs) and leading to a pseudohypoxic state[<span class="CitationRef">50</span>]. Studies have shown that succinate can activate the PI3K-AKT signaling pathway, further promoting cancer progression[<span class="CitationRef">51</span>]. These findings indicate a general uptrend in the levels of TCA cycle-related genes and metabolites within BC tissues.</p>
</div>
<div id="Sec24" class="Section2">
    <h2>3.5. Downregulation of Sphingolipid Metabolism in BC Tissues</h2>
    <p>The role of sphingolipid metabolism in cancer initiation and progression is complex and may vary across different cancer types[<span class="CitationRef">52</span>]. Bioactive sphingolipids, particularly ceramides and sphingomyelins, are extensively involved in the regulation of cell migration, differentiation, proliferation, apoptosis, and stress responses, playing a significant role in immune-dependent and vascular-associated chronic inflammatory diseases[<span class="CitationRef">53</span>, <span class="CitationRef">54</span>].</p>
    <p>When attempting to influence cancer cell growth, merely altering the level of a single sphingolipid is insufficient; rather, multiple sphingolipids must work in concert or in opposition to ultimately dictate cancer cell proliferation or apoptosis (Fig. <span class="InternalRef">5</span>A). In BC tissues, we observed a downregulation of genes associated with the Sphingosine kinase 1 (SK1) enzyme, including ceramide kinase (CERK) and sphingosine kinase 1 (SPHK1), as well as the glutamate-cysteine ligase (GCS) enzyme-related gene mannosyl-oligosaccharide glucosidase (MOGS) and the sphingosine-1-phosphate lyase 1 (SPL1) enzyme-related gene SGPL1 (Figs. <span class="InternalRef">5</span>B <strong>&ndash; F</strong>). This decrease in expression levels was accompanied by a reduction in the levels of various metabolites, including 3-Dehydrosphinganine, N-Palmitoyl sphingomyelin, C20 Sphingomyelin, and Galactosyl ceramide (d18:1/20:0, d18:1/22:0, d18:1/24:0) (Figs. <span class="InternalRef">5</span>G <strong>&ndash; J</strong>). In consistent, the expression of CERK and SPHK1 was negatively correlated with the OS of BC patientsand the expression of CERK and SPHK1 was downregulated in BC tissues compared with normal tissues. (<strong>Supplementary Fig. S10</strong>)</p>
    <p>The diminished levels of sphingolipid metabolites may lead to increased cancer cell proliferation and migration, potentially facilitating tumor progression by affecting immune cells in the TME. However, the specific mechanisms by which these metabolites influence tumor behavior require further investigation.</p>
</div>
<div id="Sec25" class="Section2">
    <h2>3.6. Downregulation of Tryptophan Metabolism in BC Tissues</h2>
    <p>Tryptophan is an essential amino acid for humans, obtained solely through dietary sources. It plays a crucial role in protein biosynthesis and serves as a precursor for various important bioactive compounds[<span class="CitationRef">55</span>]. The tryptophan metabolism primarily consists of the kynurenine pathway, the serotonin (5-HT) pathway, and the indole pathway[<span class="CitationRef">56</span>]. Key rate-limiting enzymes involved in tryptophan metabolism include indoleamine-2,3-dioxygenase (TDO), tryptophan-2,3-dioxygenase (IDO), kynurenine-3-monooxygenase (KMO), and tryptophan hydroxylase (TPH) (Fig. <span class="InternalRef">6</span>A).</p>
    <p>Interestingly, despite the upregulation of the tryptophan metabolic pathway in most cancers and the clinical trials involving IDO1 inhibitors, our findings indicate that the expression levels of this pathway in cancer tissues are downregulated[<span class="CitationRef">57</span>]. Specifically, the expression levels of rate-limiting enzymes associated with the tryptophan metabolic pathway, such as IDO1, KMO, and TPH1, were significantly lower in cancerous tissues compared to normal tissues (Figs. <span class="InternalRef">6</span>B <strong>&ndash; E</strong>). This downregulation was accompanied by decreased levels of the metabolic products L-Tryptophanamide and D-Kynurenine (Figs. <span class="InternalRef">6</span>F <strong>&ndash; G</strong>). Notably, the expression of these genes was positively correlated with the OS of BC patients, and the expression of KMO was downregulated in BC tissues compared with normal tissues. (<strong>Supplementary Fig. S11</strong>). The mechanisms by which the tryptophan metabolic pathway enzymes and their metabolites function in BC cells warrant further investigation.</p>
</div></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">4. Discussion</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded-full tw-text-gray-500 group-hover:tw-bg-gray-200 group-hover:tw-text-gray-900 tw-transform tw-duration-300 -tw-rotate-180"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></div></div></button></div><div class="tw-pb-1"><div class="tw-text-base tw-antialiased tw-leading-relaxed tw-text-left tw-text-black md:tw-leading-loose _fulltext-content"><span style="display:block"><div><p>BC, as a common malignancy of the urinary system, severely impacts patients' survival and health[<span citationid="CR58" class="CitationRef">58</span>]. Clinically, BC treatment remains to be limited to surgical interventions and radiotherapy, with a lack of precision therapeutic strategies[<span citationid="CR59" class="CitationRef">59</span>]. By combining ST and SM, we have revealed significant heterogeneity between BC tissues and normal tissues. In the malignant progression of BC, key genes associated with choline metabolism and the TCA cycle were significantly upregulated, while key genes related to sphingolipid metabolism and tryptophan metabolism were significantly downregulated. Further analysis of SM data revealed a significant upregulation of metabolites related to choline metabolism and the TCA cycle, alongside a notable downregulation of metabolites associated with sphingolipid and tryptophan metabolism. The downregulation of the AMPK pathway in cancer tissues promoted choline generation and carbon metabolism, thereby facilitating the malignant progression of BC.</p> <p>Among our findings, CHKα and the CCT family are crucial enzymes involved in the metabolism of cellular membrane phospholipids, participating in the synthesis of PC, a key component of the cell membrane. Studies have shown that the CHKα and the CCT family are closely associated with the proliferation, migration, and survival of cancer cells[<span additionalcitationids="CR61 CR62" citationid="CR60" class="CitationRef">60</span>&ndash;<span citationid="CR63" class="CitationRef">63</span>]. Given their essential roles in cancer cell metabolism and membrane synthesis, these enzymes are considered promising targets for cancer therapy. Currently, several inhibitors targeting CHKα, such as MN58b, EB3D, and TCD-717, are undergoing preclinical research[<span additionalcitationids="CR65" citationid="CR64" class="CitationRef">64</span>&ndash;<span citationid="CR66" class="CitationRef">66</span>]. These compounds hold promise for the treatment of solid tumors as well as for overcoming resistance to chemotherapy and radiotherapy. Besides, the downregulation of IDO in BC suggests that IDO inhibitors may not be suitable for BC.</p> <p>  </p> <p> <b>Graphic Abstract. Schematic illustration of BC metabolic reprogramming.</b> </p> <p>Furthermore, we analyzed the survival data of these genes in clinical BC samples through Kaplan Meier plotter databases, as well as the differences in gene expression levels between BC tissues and normal tissues (<b>Supplementary Fig. S7, S9, S10, S11</b>). These findings largely corroborate our conclusions, providing additional support for our hypotheses. Some discrepancies in the gene analysis results may arise due to our limited sample size or the relatively small number of normal bladder tissue samples available in the online databases. Moreover, the adjacent normal tissue samples and cancer samples analyzed through online databases are not paired, which may account for the discrepancies between the results of certain genes and our findings.</p> <p>In addition, we analyzed the correlation between genes and their association with any identified cancer hallmarks (<b>Supplementary Fig. S12, Supplementary Table. S2</b>). The genes we identified are primarily involved in the process of reprogramming energy metabolism, resisting cell death and sustaining proliferative signaling. Energy metabolism reprogramming is a key characteristic of cancer cells, referring to the process by which cancer cells alter their metabolic pathways to adapt to the TME and promote tumor growth during their proliferation[<span citationid="CR67" class="CitationRef">67</span>]. This metabolic reprogramming enables cancer cells to adapt to hostile microenvironments, driving tumor growth, metastasis, and resistance to therapy[<span citationid="CR68" class="CitationRef">68</span>]. Cancer biomarkers involved in energy metabolism reprogramming are typically closely associated with these altered metabolic pathways[<span citationid="CR69" class="CitationRef">69</span>]. These biomarkers primarily support the rapid proliferation, survival, and therapeutic resistance of cancer cells by regulating their metabolic processes. The alterations in these pathways are not only linked to tumor initiation and progression, but also offer potential targets for research into therapeutic resistance. Interventions targeting these metabolic markers may provide new directions for targeted therapies in cancer treatment.</p> <p>By comparing the spatial distribution of differentially expressed genes and their metabolites, we found that most upregulated genes and their associated metabolites are predominantly located in the hypoxic regions of the tumor. The hypoxic microenvironment is a common and significant characteristic of most solid tumors[<span citationid="CR70" class="CitationRef">70</span>]. Hypoxia has profound effects on the biological behavior and malignant phenotype of cancer cells, mediating the efficacy of chemotherapy, radiotherapy, and immunotherapy through complex mechanisms, and is closely associated with poor prognosis in various cancer patients[<span citationid="CR71" class="CitationRef">71</span>]. Our study reveals that the upregulation of choline metabolism and glycolysis levels in cancer cells under hypoxic conditions reflects alterations in signaling pathways that enable cancer cells to adapt to low oxygen environments. This may also contribute to mechanisms of hypoxia-induced immune tolerance, chemotherapy resistance, and enhanced radiotherapy resistance in cancer.</p> <p>In conclusion, our findings indicate that there is significant metabolic reprogramming during the onset and progression of BC. This study provides new insights into the malignant progression and immune evasion mechanisms of BC, as well as new clues for the development of targeted clinical therapies. Given the limited number of clinical samples, some degree of bias may be present. Furthermore, our findings only highlight the pathways, associated genes, and metabolites that are upregulated and downregulated in BC, while the underlying mechanisms require further investigation.</p></div></span></div></div></div><div class="tw-border-b-2 tw-border-gray-100 tw-px-4"><div class="tw-flex tw-items-start tw-justify-between tw-min-w-full"><button type="button" class="focus:tw-outline-none tw-group tw-min-w-full"><div class="tw-flex tw-items-start tw-justify-between"><div class="tw-py-2 tw-w-full"><h2 class="tw-antialiased tw-font-bold tw-text-left tw-text-blue-900 tw-text-xl">Declarations</h2></div><div class="tw-py-2 sm:tw-border-r-2 sm:tw-border-white"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="tw-ml-4 tw-h-7 tw-w-7 tw-flex-shrink-0 tw-rounded
