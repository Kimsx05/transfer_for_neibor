<!doctype html><html lang="zh"><meta charset="utf-8"><title>免疫指标与 MP10</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;color:#253b42}select{font:inherit;margin:0 1em 0 .3em;padding:.3em}svg{width:100%;height:auto}small{color:#445c65}#legend span{margin-right:1em}circle:hover{stroke:black}</style><h1>免疫空间指标与 MP10</h1><label>指标<select id="m"></select></label><label>视图<select id="e"><option>mean_MP10</option><option>median_MP10</option><option>D_all_E</option><option>D_E_without_I_enriched</option><option>section_distribution</option></select></label><p id="legend"></p><svg viewBox="0 0 1040 530" id="v" role="img"></svg><small>关联图中每点为一个有映射的分析单位，线为来源内观测范围上的描述性线性趋势。分布图按来源显示每张肿瘤切片的实测值，含未知患者身份。将指针移至点查看编号和原始数值。正式 Spearman 推断及样本数见 tables/all_metric_associations.tsv.gz。</small><script>const data=/*DATA*/;const cols=['#276693','#c66645','#32846c','#81568f','#957137','#3f91a2','#9a4b66'];const ns='http://www.w3.org/2000/svg';const el=(k,props,txt)=>{let q=document.createElementNS(ns,k);for(let [x,y] of Object.entries(props))q.setAttribute(x,y);if(txt!=null)q.textContent=txt;v.append(q);return q};for(const key of Object.keys(data.metrics).sort())m.add(new Option(key,key));m.value='penetration_T_200';legend.innerHTML=data.sources.map((s,i)=>'<span style="color:'+cols[i]+'">● '+s.split('__')[0]+'</span>').join('');function draw(){v.replaceChildren();let type=e.value,hist=type=='section_distribution',arr=data.metrics[m.value][type]||[];if(!arr.length){el('text',{x:50,y:70},'无可比较数据');return}let xx=arr.map(a=>a[2]),yy=arr.map(a=>hist?a[1]:a[3]),min=Math.min(...xx),max=Math.max(...xx),bot=hist?-1:Math.min(...yy),top=hist?data.sources.length:Math.max(...yy);let sx=x=>135+855*(x-min)/(max-min||1),sy=y=>455-405*(y-bot)/(top-bot||1);el('line',{x1:135,x2:990,y1:455,y2:455,stroke:'#899'});el('line',{x1:135,x2:135,y1:50,y2:455,stroke:'#899'});for(let i=0;i<=5;i++){let x=min+(max-min)*i/5;el('text',{x:sx(x),y:480,'text-anchor':'middle','font-size':13},Number(x.toPrecision(3)));if(!hist){let y=bot+(top-bot)*i/5;el('text',{x:126,y:sy(y),'text-anchor':'end','font-size':13},Number(y.toPrecision(3)))}}el('text',{x:560,y:515,'text-anchor':'middle'},m.value);el('text',{x:135,y:30},hist?'肿瘤切片 · 按来源的分布':type);for(let j=0;j<data.sources.length;j++){let a=arr.filter(r=>r[1]==j);if(hist)el('text',{x:127,y:sy(j),'text-anchor':'end','font-size':12},data.sources[j].split('__')[0]);if(!hist&&a.length>=3){let mean=i=>a.reduce((s,r)=>s+r[i],0)/a.length,ax=mean(2),ay=mean(3),den=a.reduce((s,r)=>s+(r[2]-ax)**2,0),slope=a.reduce((s,r)=>s+(r[2]-ax)*(r[3]-ay),0)/den,ext=a.map(r=>r[2]);if(den>0){let l=Math.min(...ext),h=Math.max(...ext);el('line',{x1:sx(l),x2:sx(h),y1:sy(ay+slope*(l-ax)),y2:sy(ay+slope*(h-ax)),stroke:cols[j],opacity:.65})}}a.forEach((r,i)=>{let y=hist?j+.055*((i%7)-3):r[3],p=el('circle',{cx:sx(r[2]),cy:sy(y),r:4,fill:cols[j],opacity:.8});let t=document.createElementNS(ns,'title');t.textContent=(hist?r[0]:data.units[r[0]])+' | x='+r[2]+(hist?'':' | y='+r[3]);p.append(t)})}}m.onchange=e.onchange=draw;draw();</script></html>
